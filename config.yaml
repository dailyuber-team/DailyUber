# Configuration de DailyUber. Les secrets (webhook Discord) vont dans .env, pas ici.

address:
  # Point central d'Aix-en-Provence (Cours Mirabeau). `reference` (ID Google Places)
  # est optionnel : latitude/longitude suffisent pour que le flux soit correct.
  label: "Cours Mirabeau, 13100 Aix-en-Provence"
  latitude: 43.5266217
  longitude: 5.447877
  reference: "EipDciBNaXJhYmVhdSwgMTMxMDAgQWl4LWVuLVByb3ZlbmNlLCBGcmFuY2UiLiosChQKEgnLZxrRl43JEhGDes8JkrzvORIUChIJWRK5BKONyRIRo4i2yL5TuVw"

fetch:
  max_feed_pages: 0          # ~80 restaurants par page ; 0 = toutes (environ 400 restaurants, 5 pages, le 27/10). Les restaurants pas encore
                             # ouverts sont en fin de flux : avec 3 pages, une recherche à 10-11 h
                             # ratait ceux qui ouvrent à midi ou le soir.
  max_stores: 40             # nombre max de menus récupérés (1 requête chacun) ; 0 = tous
                             # (GitHub Actions les récupère tous : --max-stores 0)
  min_delay_s: 2.0           # délai aléatoire entre deux requêtes
  max_delay_s: 5.0
  headless: true
  cache_max_age_min: 30      # au-delà, une nouvelle récupération est lancée
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

prefilter:
  # Appliqué sur le flux, avant de télécharger les menus.
  min_rating: 0              # 0 = tous les restaurants, quelle que soit leur note (affichée sur
                             # chaque offre) ; les restaurants sans note sont toujours gardés
  max_eta_min: 45

# Estimation des frais : Uber ne donne le montant exact qu'au checkout (compte requis).
fees:
  default_delivery_fee: 2.49   # utilisé si le flux n'affiche pas de frais de livraison
  service_fee_pct: 0.10        # à calibrer sur une vraie commande
  service_fee_min: 0.99
  service_fee_max: 4.99
  small_order_threshold: 8.00  # "2 EUR pour les commandes inférieures à 8 EUR" (texte Uber)
  small_order_fee: 2.00
  # Abonnement Uber One (France) : livraison à 0 € et jusqu'à -50 % sur les frais
  # de service dès 12 € d'articles. Activable aussi avec --uber-one / --no-uber-one.
  uber_one:
    enabled: false
    min_subtotal: 12.00
    service_fee_discount: 0.50   # "jusqu'à 50 %" : valeur max, à calibrer sur une vraie commande
  # Frais propres à une autre plateforme (remplacent ceux ci-dessus ; Uber One ne s'y applique pas).
  platforms:
    deliveroo:
      default_delivery_fee: 2.49   # si le menu n'affiche pas "X € de livraison"
      service_fee_pct: 0.10        # non affichés par Deliveroo avant le paiement : à calibrer
      service_fee_min: 0.99
      service_fee_max: 4.99
      small_order_threshold: 0.00  # Deliveroo impose un "montant min." (min_order) au lieu d'un supplément
      small_order_fee: 0.00

# Définition d'un "repas" : un article compte comme plat principal si sa section
# OU son titre contient un mot-clé "main", et ni l'un ni l'autre un mot-clé "exclude".
meal:
  min_item_price: 6.00         # sous ce prix, un article n'est pas un repas (ex. une empanada seule)
  main_keywords: [plat, menu, formule, burger, pizza, tacos, kebab, bowl, poke, poké, sandwich,
                  wrap, plateau, box, salade, pâtes, pasta, curry, bo bun, ramen, burrito,
                  bagel, panini, tenders, sushi, maki, wok, riz, nouilles, signature, smash, crousty]
  exclude_keywords: [boisson, drink, soda, coca, eau, bière, vin, dessert, glace, sauce,
                     accompagnement, frite, side, supplément, extra, entrée, snack, enfant,
                     kid, cookie, brownie, tiramisu, verrine, dip, nugget]
  # Exclus même si le titre contient un mot-clé "main" (ex. "Crousty Nutella Banane", un dessert).
  always_exclude_keywords: [nutella, chocolat, speculoos, oreo, kinder]

# Types de repas (filtre de l'appli et --type). Un plat est d'un type si son titre ou sa
# section contient un des mots-clés ; sinon il prend les types du restaurant, d'après
# son nom ("Tasty Crousty") et sa liste de cuisines Uber Eats ("Italienne", "Sushis"...).
meal_types:
  burger:      {label: "Burger", keywords: [burger, smash, cheeseburger], cuisines: [burgers]}
  crousty:     {label: "Crousty", keywords: [crousty], cuisines: []}
  pizza:       {label: "Pizza", keywords: [pizza, margherita, calzone], cuisines: [pizzas]}
  sushi:       {label: "Sushi & japonais", keywords: [sushi, maki, california, sashimi, chirashi, gunkan,
                                                     nigiri, temaki, ramen, donburi, yakitori], cuisines: [japonaise, sushis]}
  asiatique:   {label: "Asiatique", keywords: [wok, bo bun, nouilles, pad thaï, pad thai, nems, dim sum, banh mi,
                                              riz cantonais, bibimbap, curry], cuisines: [asiatique, asiatique (fusion),
                                              chinoise, thaïlandaise, vietnamienne, coréenne, indienne]}
  poke:        {label: "Poké", keywords: [poke, poké, bowl], cuisines: [poke (poisson cru)]}
  tacos_kebab: {label: "Tacos & kebab", keywords: [tacos, kebab, döner, doner, durum, dürüm, shawarma], cuisines: [tacos, kebab, turque]}
  sandwich:    {label: "Sandwich & boulangerie", keywords: [sandwich, wrap, panini, bagel, croque, baguette, club],
                cuisines: [sandwich, boulangerie]}
  salade:      {label: "Salade & healthy", keywords: [salade, healthy, veggie], cuisines: [salades, cuisine saine,
                                                                                         végétarienne, 100 % végétarien]}
  pates:       {label: "Pâtes & italien", keywords: [pâtes, pasta, lasagne, risotto, gnocchi, carbonara, bolognaise,
                                                    spaghetti, penne, tagliatelle], cuisines: [italienne, pâtes]}
  poulet:      {label: "Poulet", keywords: [poulet, chicken, tenders, wings, crousty, nuggets], cuisines: [poulet]}

selection:
  group_sizes: [2, 4]
  max_price_per_person: 10.00
  top_n: 5
  min_distinct_items: 1      # 2+ = imposer des plats différents dans le panier

scoring:
  # score = w_price * (1 - prix_pp / max_pp) + w_rating * note/5 + w_eta * (1 - eta / max_eta)
  w_price: 0.6
  w_rating: 0.25
  w_eta: 0.15

# Restaurants favoris : toujours analysés, même hors des `max_stores` retenus ou absents du
# flux du jour, et affichés dans l'onglet Favoris de l'appli. Un lien Uber Eats du restaurant
# (…/store/<nom>/<identifiant>) ou son UUID. Les étoiles mises dans l'appli restent sur le
# téléphone : pour qu'un favori soit vérifié chaque jour, il faut aussi l'ajouter ici.
favorites: []
#  - https://www.ubereats.com/fr/store/pekyo/o1RM0wMxRn6Xy4keWIR-AA

# Deliveroo, en plus d'Uber Eats : liste du quartier, puis un menu par restaurant (sans navigateur).
# Deliveroo n'affiche pas d'horaires : la liste est interrogée à ces heures, aujourd'hui et demain,
# et chaque présence devient un créneau d'une heure autour de l'heure.
deliveroo:
  enabled: true
  city: aix-en-provence
  neighborhood: aix-centre
  sample_times: ["12:00", "13:00", "19:00", "20:00", "21:00"]

storage:
  data_dir: data
